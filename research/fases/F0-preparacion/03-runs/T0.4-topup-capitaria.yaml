# max(t_msc) esta a menos de tolerancia_horas del final del tramo; si no, se
# re-descarga el mes ENTERO con sobrescritura segura (tmp -> validar
# integridad -> .bak-<timestamp> -> rename; el fichero anterior nunca se
# borra). F0-DATA-0001 (julio) por tanto SI completa 202607.parquet al
# correr: su cobertura actual (hasta ~2026-07-24) esta muy por encima de
# tolerancia_horas del cierre de mes.
