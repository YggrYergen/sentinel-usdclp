[pytest]
# The default run excludes the `slow` marker. See conftest.py for what earns that
# marker and why. To run everything (CI, release checks, or when you touch the
# optimizer itself):
#
#     python -m pytest -m "slow or not slow"      # the whole repo
#     python -m pytest -m slow                    # only the quarantined heavy tests
#
addopts = -m "not slow"

markers =
    slow: heavy replay/optimizer tests that score real market data; excluded from the default run.
